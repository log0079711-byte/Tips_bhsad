<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <video autoplay loop playsinline webkit-playsinline controls id="vid">
        <source src="video.mp4" type="video/mp4">
    </video>
    <script>
        const video = document.getElementById('vid');
        
        // Принудительный сброс на 0 при любой загрузке
        video.addEventListener('loadstart', () => video.currentTime = 0);
        video.addEventListener('loadedmetadata', () => video.currentTime = 0);
        video.addEventListener('canplay', () => video.currentTime = 0);
        
        // Дополнительно: если seek произошёл до 0 - сброс
        video.addEventListener('seeking', () => {
            if (video.currentTime > 1) {
                video.currentTime = 0;
            }
        });
        
        // Autoplay
        video.play().catch(e => console.log('Tap to play'));
    </script>
</body>
</html>
